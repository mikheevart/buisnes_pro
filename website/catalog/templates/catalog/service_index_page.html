{% extends "base.html" %}
{% load wagtailcore_tags %}

{% block content %}
<section class="uk-section uk-section-default">
    <div class="uk-container">
        <h1 class="uk-text-center uk-margin-large-bottom">{{ page.title }}</h1>
        <div class="uk-text-lead uk-text-center uk-margin-medium-bottom">{{ page.intro|richtext }}</div>
        
        <!-- Сетка UIkit для карточек услуг -->
        <div class="uk-child-width-1-3@m uk-child-width-1-2@s uk-grid-match" uk-grid>
            {% for service in services %}
                <div>
                    <div class="uk-card uk-card-default uk-card-body uk-card-hover uk-flex uk-flex-column">
                        <span uk-icon="icon: {{ service.icon_name }}; ratio: 2" class="uk-text-primary"></span>
                        <h3 class="uk-card-title uk-margin-top">{{ service.title }}</h3>
                        <div class="uk-text-meta uk-margin-small-bottom">{{ service.price }}</div>
                        <div class="uk-flex-item-1">{{ service.description|richtext|truncatewords:20 }}</div>
                        <a href="{{ service.url }}" class="uk-button uk-button-text uk-margin-medium-top uk-text-primary">Подробнее</a>
                    </div>
                </div>
            {% endfor %}
        </div>
    </div>
</section>
{% endblock %}
